# Security updates are enabled in the repo settings; this file only shapes the PRs they open.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # 0 = no routine version bumps — only security fixes open PRs.
    open-pull-requests-limit: 0
    labels: [dependencies, security]
    # schedule is inert while the limit is 0; security PRs open as soon as an alert fires.
    commit-message:
      prefix: "fix(deps)"
      prefix-development: "chore(deps-dev)"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(ci)"
